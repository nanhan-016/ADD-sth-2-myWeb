photo.src=product.image_assets[0].source_url;
external(el('original'),photo.src);
for(const [label,text] of [['电池容量',specs.battery_capacity],['额定交流功率',specs.rated_ac_power_kw.toLocaleString('zh-CN')+' kW'],['电池舱防护等级',specs.battery_enclosure.ip]]){
const card=make('div');card.className='metric';card.append(make('small',label),make('strong',text));el('facts').append(card);
}
const categories={form:'造型',color:'色彩',material:'材料',surface_manufacturing:'表面处理与制造表达',details:'细节',overall_style:'整体风格类型',visual_perception:'视觉感知'};
const empty={material:'外壳材质待核验。',surface_manufacturing:'光泽与工艺待核验。'};
const statuses={OBSERVED:'直接证据',INFERRED:'有依据的推断'};
function render(filter){
el('groups').replaceChildren();
for(const {category_id:id,label,tags:chips} of product.design_tags.display_groups){
const items=chips.flatMap(chip=>chip.assignment_ids.map(id=>tags.find(tag=>tag.assignment_id===id))).filter(tag=>tag&&(!filter||tag.status===filter));
if(filter&&!items.length)continue;
const group=make('article');group.className='tag-group';group.append(make('h3',label));
const tray=make("div");tray.className="tag-tray";group.append(tray);
if(!items.length){const note=make('small',empty[id]||'暂无标签');tray.append(note)}
for(const tag of items){
const details=make('details'),title=make('summary',tag.label);
const badge=make('span',statuses[tag.status]);badge.className='pill'+(tag.status==='INFERRED'?' inferred':'');title.append(badge);
const basis=make('p',tag.part+'。'+(tag.basis??tag.reason));details.append(title,basis);
tag.evidence_ids.forEach((id,index)=>{if(index)details.append(' · ');const source=sources.get(id);if(source)details.append(external(make('a',id+' '+source.locator),source.url))});
tray.append(details);
}
el('groups').append(group);
}
}
for(const [key,label] of [['','全部'],...Object.entries(statuses)]){
const button=make('button',label+' '+tags.filter(tag=>!key||tag.status===key).length);button.type='button';button.setAttribute('aria-pressed',String(!key));
button.onclick=()=>{for(const child of el('filters').children)child.setAttribute('aria-pressed',String(child===button));render(key)};el('filters').append(button);
}
render('');
const series=record.series.find(item=>item.series_id===value('series_id'));
for(const [label,text] of [['企业',value('company')],['系列',series?.name],['平台发布年份',series?.platform_launch_year?.value],['应用',value('application')],['关键部件',value('key_components').join('、')],['温控',specs.thermal_management],['电池箱尺寸（宽 × 高 × 深）',specs.battery_enclosure.dimensions_whd_mm.join(' × ')+' mm']]){
el('info').append(make('dt',label),make('dd',text??'待核验'));
}
for(const item of sources.values()){const li=make('li');li.append(external(make('a',item.id+' '+item.locator),item.url));el('sources').append(li)}
el('date').textContent='资料采集于 '+record.collected_at+'。'+product.visual_evidence_scope+' 原图下载与截图均未取得文件，图片在线加载。';
</script>
</html>
